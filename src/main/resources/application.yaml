server:
  port: 7512

spring:
  application:
    name: trainlife

  datasource:
    url: jdbc:postgresql://localhost:5434/trainlife_db
    username: postgres
    password: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public   # во избежание PSQLException: ERROR: no schema has been selected to create in
    default-schema: public

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect # явное указание синтаксиса SQL (избыточно)

jwt:
  secret: EoYfn+/v4h29//n4yYMbaBtFQRQxMRzXmmSTyqaj91g=
  expiration-ms: 2700000  # 45 min
  cookie-name: jwt-token
  cookie-http-only: true
  cookie-secure: false
  cookie-max-age: 2700

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.authentication.dao: TRACE
