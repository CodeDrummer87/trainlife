server:
  port: 7512

spring:
  application:
    name: trainlife

  datasource:
    url: jdbc:postgresql://localhost:5434/trainlife_db
    username: postgres
    password: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update  # обновление схемы БД при запуске проекта (только для разработки)
    show-sql: true      # выводит SQL-запросы при их выполнении в консоль
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect # явное указание синтаксиса SQL (избыточно)
