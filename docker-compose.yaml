volumes:
  trainlife:

services:
  trainlife_db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_DB=trainlife_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - trainlife:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"